allowBuilds:
  # esbuild's postinstall just downloads its platform binary — required by
  # drizzle-kit and vitest, safe to allow.
  esbuild: true
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - '@ai-sdk/deepseek@2.0.59'
  - '@ai-sdk/provider-utils@4.0.48'
