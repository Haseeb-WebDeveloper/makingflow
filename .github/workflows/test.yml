name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:unit

  integration:
    name: integration (postgres service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: makingflow_test
          POSTGRES_PASSWORD: makingflow_test
          POSTGRES_DB: makingflow_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U makingflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          # Point at the Postgres service above. setup-integration.ts refuses
          # to run (and db:migrate can't connect) without this.
          DATABASE_URL: postgres://makingflow_test:makingflow_test@localhost:54322/makingflow_test

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: makingflow_test
          POSTGRES_PASSWORD: makingflow_test
          POSTGRES_DB: makingflow_test
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U makingflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
          # The Playwright webServer boots the app, which needs a database.
          DATABASE_URL: postgres://makingflow_test:makingflow_test@localhost:54322/makingflow_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
